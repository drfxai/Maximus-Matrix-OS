name: Build and Release MAXIMUS MATRIX AI V1.0.2

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "scripts/check_english_only.py"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: v1.0.2
      RELEASE_TITLE: MAXIMUS MATRIX AI V1.0.2
      RELEASE_APK: MAXIMUS_MATRIX_AI_V1.0.2_arm64V8a.apk
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      SECRET_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SECRET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce English-only repository policy
        run: python3 scripts/check_english_only.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare release signing
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/maximus-release.jks"
          if [[ -n "${KEYSTORE_B64:-}" && -n "${SECRET_STORE_PASSWORD:-}" && -n "${SECRET_KEY_ALIAS:-}" && -n "${SECRET_KEY_PASSWORD:-}" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            STORE_PASSWORD="$SECRET_STORE_PASSWORD"
            KEY_ALIAS="$SECRET_KEY_ALIAS"
            KEY_PASSWORD="$SECRET_KEY_PASSWORD"
            SIGNING_MODE="repository-secret"
          else
            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS="maximus"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA -keysize 4096 -validity 3650 \
              -dname "CN=MAXIMUS MATRIX AI, OU=DrFXAi, O=DrFXAi, L=Unknown, S=Unknown, C=US"
            SIGNING_MODE="ephemeral-ci"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_MODE=$SIGNING_MODE" >> "$GITHUB_ENV"
          echo "mode=$SIGNING_MODE" >> "$GITHUB_OUTPUT"

      - name: Run tests
        working-directory: android-app
        run: gradle test --no-daemon --stacktrace

      - name: Build signed ARM64 release APK
        working-directory: android-app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify and stage release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find android-app/app/build/outputs/apk -type f -name '*arm64-v8a*release*.apk' | head -n 1)"
          if [[ -z "$APK" ]]; then
            echo "ARM64 release APK was not produced."
            find android-app/app/build/outputs/apk -type f -maxdepth 5 -print || true
            exit 1
          fi
          cp "$APK" "dist/$RELEASE_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "dist/$RELEASE_APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "dist/$RELEASE_APK" | tee dist/APK_BADGING.txt
          if ! grep -q "native-code: 'arm64-v8a'" dist/APK_BADGING.txt; then
            echo "APK does not declare arm64-v8a native code."
            exit 1
          fi
          (cd dist && sha256sum "$RELEASE_APK" > SHA256SUMS)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAXIMUS-MATRIX-AI-V1.0.2-arm64
          path: |
            dist/${{ env.RELEASE_APK }}
            dist/SHA256SUMS
            dist/APK_BADGING.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Preserving the existing release to avoid signing-key drift."
            exit 0
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<NOTES
          # MAXIMUS MATRIX AI V1.0.2

          ARM64 Android runtime for Maximus Matrix OS.

          - ABI: arm64-v8a
          - Package: ai.drfx.maximus.matrixai
          - Version: 1.0.2 (3)
          - Live graph-native agent interface
          - Real Android device tools: device status, web, settings, camera, alarms, calendar, dialer, SMS composer, share, clipboard and app launch
          - Custom MAXIMUS MATRIX AI launcher icon
          - Mission planning, policy, tool, validation, and artifact event pipeline
          - English-only repository enforcement
          - SHA-256 checksum included
          - Signing mode: $SIGNING_MODE

          If signing mode is ephemeral-ci, configure the repository signing secrets before publishing a future update. A stable production key is required for Android upgrade continuity.
          NOTES
          gh release create "$RELEASE_TAG" \
            "dist/$RELEASE_APK" \
            "dist/SHA256SUMS" \
            "dist/APK_BADGING.txt" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
