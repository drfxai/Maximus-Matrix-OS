name: Build and Release MAXIMUS MATRIX AI V1.0.1

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: v1.0.1
      RELEASE_TITLE: MAXIMUS MATRIX AI V1.0.1
      RELEASE_APK: MAXIMUS_MATRIX_AI_V1.0.1_arm64V8a.apk
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      SECRET_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SECRET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare release signing
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/maximus-release.jks"
          if [[ -n "${KEYSTORE_B64:-}" && -n "${SECRET_STORE_PASSWORD:-}" && -n "${SECRET_KEY_ALIAS:-}" && -n "${SECRET_KEY_PASSWORD:-}" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            STORE_PASSWORD="$SECRET_STORE_PASSWORD"
            KEY_ALIAS="$SECRET_KEY_ALIAS"
            KEY_PASSWORD="$SECRET_KEY_PASSWORD"
            SIGNING_MODE="repository-secret"
          else
            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS="maximus"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA -keysize 4096 -validity 3650 \
              -dname "CN=MAXIMUS AI Preview, OU=DrFXAi, O=DrFXAi, L=Unknown, S=Unknown, C=US"
            SIGNING_MODE="ephemeral-ci"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_MODE=$SIGNING_MODE" >> "$GITHUB_ENV"
          if [[ "$SIGNING_MODE" == "ephemeral-ci" ]]; then
            echo "RELEASE_APK=MAXIMUS_MATRIX_AI_V1.0.1_arm64V8a-PREVIEW.apk" >> "$GITHUB_ENV"
          fi
          echo "mode=$SIGNING_MODE" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: gradle test --no-daemon --stacktrace

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify keyboard layout on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -memory 2048
          script: |
            test_status=0
            gradle connectedDebugAndroidTest --no-daemon --stacktrace || test_status=$?
            mkdir -p keyboard-check
            adb pull /data/local/tmp/keyboard-check keyboard-check || true
            adb exec-out screencap -p > keyboard-check/final-screen.png
            adb logcat -d > keyboard-check/device.log
            exit "$test_status"

      - name: Upload keyboard verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keyboard-layout-Android15
          path: |
            keyboard-check/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify and stage release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep -i 'release' | head -n 1)"
          if [[ -z "$APK" ]]; then
            echo "Release APK was not produced."
            find app/build/outputs/apk -type f -maxdepth 5 -print || true
            exit 1
          fi
          cp "$APK" "dist/$RELEASE_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "dist/$RELEASE_APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "dist/$RELEASE_APK" | tee dist/APK_BADGING.txt
          if ! grep -q "application-icon" dist/APK_BADGING.txt; then
            echo "APK does not contain a launcher icon."
            exit 1
          fi
          (cd dist && sha256sum "$RELEASE_APK" > SHA256SUMS)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAXIMUS-MATRIX-AI-V1.0.1-${{ steps.signing.outputs.mode }}-arm64
          path: |
            dist/${{ env.RELEASE_APK }}
            dist/SHA256SUMS
            dist/APK_BADGING.txt
          if-no-files-found: error

      - name: Replace old releases and publish V1.0.1
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for entry in "v1.0.1:397702650" "v1.0.2:397746356" "v1.0.3:397757576"; do
            IFS=: read -r old_tag old_id <<< "$entry"
            found="$(gh api "repos/$GITHUB_REPOSITORY/releases/$old_id" --jq .tag_name 2>/dev/null || true)"
            if [[ -n "$found" ]]; then
              if [[ "$found" != "$old_tag" ]]; then
                echo "Release ID $old_id no longer matches $old_tag. Stopping before deletion."
                exit 1
              fi
              gh release delete "$old_tag" --cleanup-tag --yes
            fi
          done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
            if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
              echo "The verified V1.0.1 release already points to this commit."
              exit 0
            fi
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes || true
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<NOTES
          # MAXIMUS MATRIX AI V1.0.1

          Android release of MAXIMUS MATRIX OS.

          - Package: ai.drfx.maximus.matrixai
          - Version: 1.0.1 (version code 13)
          - Fixed keyboard layout: mission and chat composers stay directly above the keyboard
          - Android 15 emulator regression checks for keyboard opening, closing, and text retention
          - Living Matrix Graph with interactive drag orbit, pinch zoom, and live node inspection
          - Multi-provider LLM integration with OpenAI, Anthropic, Gemini, NVIDIA NIM Catalog
          - Deterministic agent runtime, mission planner, and risk validation engine
          - Real Android system capabilities (alarms, camera, calendar, SMS composer, share, clipboard)
          - Release APK, SHA-256 checksum, and badging metadata attached
          - Signing mode: $SIGNING_MODE
          NOTES
          release_flags=()
          if [[ "$SIGNING_MODE" == "ephemeral-ci" ]]; then release_flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            "dist/$RELEASE_APK" \
            "dist/SHA256SUMS" \
            "dist/APK_BADGING.txt" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${release_flags[@]}"

