name: Build and Release MAXIMUS MATRIX OS V1.0.0

on:
  pull_request:
  push:
    branches: [main, release/validated-v1, release/verify-v1]
  workflow_dispatch:
    inputs:
      verify_signed:
        description: Build and verify the permanent-key upgrade without publishing
        type: boolean
        default: false
      publish:
        description: Replace validated assets in the existing Stable v1.0.0 release
        type: boolean
        default: false


permissions:
  contents: read

concurrency:
  group: maximus-matrix-${{ (github.ref == 'refs/heads/release/validated-v1' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && 'release' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/release/validated-v1' && !(github.event_name == 'workflow_dispatch' && inputs.publish) }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Verify and package pinned native PRoot files
        run: python3 .github/scripts/prepare-phone-native.py
      - name: Test ARM64 runtime provenance checks
        run: python3 -m unittest discover -s .github/scripts/tests -p "test_*.py" -v
      - name: Validate five translated Android resource packs
        run: python3 .github/scripts/check-ui-locales.py
      - run: python3 .github/scripts/test-release-identity.py
      - run: python3 .github/scripts/test-release-publication.py
      - name: Test remote Worker discovery gateway
        run: python3 -m unittest discover -s remote-worker/tests -t remote-worker -v
      - name: Check every shell script
        run: for script in .github/scripts/*.sh; do bash -n "$script"; done
      - run: gradle testDebugUnitTest lintRelease assembleDebug --no-daemon --stacktrace
      - name: Verify packaged PRoot ELF bytes
        run: python3 .github/scripts/verify-phone-native-packaging.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: app/build/reports/
  emulator-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Run UI/IME tests in a fresh emulator rather than after credential/Room tests.
    # Both suites must pass before any signed build can be published.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: credentials-and-history
            test_classes: ai.drfx.maximus.matrixai.ProviderCredentialIsolationTest,ai.drfx.maximus.matrixai.database.ChatPersistenceTest,ai.drfx.maximus.matrixai.studio.StudioWorkspaceTest,ai.drfx.maximus.matrixai.studio.phonehost.PhoneHarnessIntegrationTest,ai.drfx.maximus.matrixai.ui.theme.LanguagePreferenceTest,ai.drfx.maximus.matrixai.studio.remote.RemoteWorkerProfileStoreTest,ai.drfx.maximus.matrixai.studio.ProjectContinuityStoreTest,ai.drfx.maximus.matrixai.vision.ImageInputPipelineTest,ai.drfx.maximus.matrixai.voice.ElevenVoiceSettingsTest,ai.drfx.maximus.matrixai.voice.SpeechLanguagePreferenceTest,ai.drfx.maximus.matrixai.memory.HindsightMemorySettingsTest
          - suite: keyboard
            test_classes: ai.drfx.maximus.matrixai.ui.KeyboardLayoutTest
    env:
      ANDROID_TEST_CLASSES: ${{ matrix.test_classes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Verify and package pinned native PRoot files
        run: python3 .github/scripts/prepare-phone-native.py
      - name: Precompile application and all instrumentation tests before emulator boot
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 384M
          # Avoid the SwiftShader host renderer used by the disconnected 37.2.12 run.
          # Keep real IME reopen assertions and both instrumentation suites mandatory.
          emulator-options: -no-window -gpu lavapipe -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash .github/scripts/verify-keyboard.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-evidence-${{ matrix.suite }}
          path: |
            app/build/reports/androidTests/
            keyboard-check/
  build-release:
    needs: [validate, emulator-smoke]
    if: (github.event_name == 'workflow_dispatch' && (inputs.verify_signed || inputs.publish) && github.ref == 'refs/heads/main') || (github.event_name == 'push' && (github.ref == 'refs/heads/release/validated-v1' || github.ref == 'refs/heads/release/verify-v1'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RELEASE_TAG: v1.0.0
      RELEASE_TITLE: MAXIMUS MATRIX OS V1.0.0
      ARM64_APK: MAXIMUS-MATRIX-OS-V1.0.0-arm64-v8a.apk
      UNIVERSAL_APK: MAXIMUS-MATRIX-OS-V1.0.0-universal.apk
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      SECRET_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SECRET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify and package pinned native PRoot files
        run: python3 .github/scripts/prepare-phone-native.py

      - name: Prepare release signing
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/maximus-release.jks"
          # Only the persistent release keystore may sign production APKs.
          # Missing or invalid secrets must never trigger a new key.
          if [[ -z "${KEYSTORE_B64:-}" || -z "${SECRET_STORE_PASSWORD:-}" || -z "${SECRET_KEY_ALIAS:-}" || -z "${SECRET_KEY_PASSWORD:-}" ]]; then
            echo "::error::Permanent signing secrets are missing. Set all four ANDROID_* repository secrets."
            exit 1
          fi
          umask 077
          if ! printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is invalid."
            exit 1
          fi
          test -s "$KEYSTORE_PATH" || { echo "::error::Decoded keystore is empty."; exit 1; }
          STORE_PASSWORD="$SECRET_STORE_PASSWORD"
          KEY_ALIAS="$SECRET_KEY_ALIAS"
          KEY_PASSWORD="$SECRET_KEY_PASSWORD"
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore password or alias is invalid."
            exit 1
          fi
          SIGNING_MODE="repository-secret"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_MODE=$SIGNING_MODE" >> "$GITHUB_ENV"
          echo "mode=$SIGNING_MODE" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: gradle test --no-daemon --stacktrace

      - name: Android release lint
        run: gradle lintRelease --no-daemon --stacktrace

      - name: Build signed release APKs
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify and stage ARM64 and universal APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          arm64=(app/build/outputs/apk/release/*arm64-v8a*release*.apk)
          universal=(app/build/outputs/apk/release/*universal*release*.apk)
          if [[ "${#arm64[@]}" -ne 1 || "${#universal[@]}" -ne 1 ]]; then
            echo "Expected exactly one arm64-v8a and one universal APK."
            find app/build/outputs/apk/ -type f -name '*.apk' -print || true
            exit 1
          fi
          cp "${arm64[0]}" "dist/$ARM64_APK"
          cp "${universal[0]}" "dist/$UNIVERSAL_APK"
          for apk in "dist/$ARM64_APK" "dist/$UNIVERSAL_APK"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "dist/$(basename "$apk").badging.txt"
            grep -q "versionName='1.0.0'" "dist/$(basename "$apk").badging.txt"
          done
          (cd dist && sha256sum "$ARM64_APK" "$UNIVERSAL_APK" > SHA256SUMS)

      - name: Include complete matching PRoot LGPL/GPL/BSD source
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$(mktemp -d)"
          trap 'rm -rf "$source_dir"' EXIT
          git clone --recurse-submodules https://github.com/techjarves/Mobile-Harness.git "$source_dir/mobile-harness"
          git -C "$source_dir/mobile-harness" checkout 96b1da08d03af4f2d63970a3794c7fda068948c4
          git -C "$source_dir/mobile-harness" submodule update --init --recursive
          test "$(git -C "$source_dir/mobile-harness" rev-parse HEAD)" = 96b1da08d03af4f2d63970a3794c7fda068948c4
          test -f "$source_dir/mobile-harness/third_party/proot/src/cli/proot.c"
          test -f "$source_dir/mobile-harness/third_party/libandroid-shmem/shmem.c"
          test -f "$source_dir/mobile-harness/third_party/talloc/talloc.c"
          tar -czf dist/MAXIMUS-MATRIX-OS-PRoot-Source-V1.0.0.tar.gz \
            --exclude-vcs -C "$source_dir/mobile-harness" \
            app/src/main/cpp app/src/main/assets/licenses \
            third_party/proot third_party/libandroid-shmem third_party/talloc \
            app/build.gradle.kts .gitmodules
          (cd dist && sha256sum MAXIMUS-MATRIX-OS-PRoot-Source-V1.0.0.tar.gz > NATIVE-SOURCE-SHA256SUMS)

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Maximus-Matrix-OS-V1.0.0-${{ steps.signing.outputs.mode }}
          path: dist/
          if-no-files-found: error

      - name: Verify upgrade identity against currently published APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-release-upgrade.sh

      - name: Enable KVM for signed upgrade test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify permanent-key Android in-place upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 384M
          # Avoid the SwiftShader host renderer used by the disconnected 37.2.12 run.
          # Keep real IME reopen assertions and both instrumentation suites mandatory.
          emulator-options: -no-window -gpu lavapipe -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash .github/scripts/verify-signed-upgrade.sh

      - name: Preserve signed upgrade evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-upgrade-evidence
          path: upgrade-check/

      - name: Preserve current release APKs before replacement
        uses: actions/upload-artifact@v4
        with:
          name: previous-release-apks
          path: previous/
          if-no-files-found: error

      - name: Update existing Stable V1.0.0 assets
        if: (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/release/validated-v1')
        env:
          RELEASE_PUBLICATION_APPROVED: 'true'
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/maximus-release.jks"
