name: Build and Release MAXIMUS MATRIX OS V1.0.0

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-release.yml"
      - ".github/scripts/verify-keyboard.sh"
  workflow_dispatch:
    inputs:
      publish:
        description: "Replace the existing v1.0.0 assets after validation"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: maximus-matrix-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RELEASE_TAG: v1.0.0
      RELEASE_TITLE: MAXIMUS MATRIX OS V1.0.0
      ARM64_APK: MAXIMUS-MATRIX-OS-V1.0.0-arm64-v8a.apk
      UNIVERSAL_APK: MAXIMUS-MATRIX-OS-V1.0.0-universal.apk
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      SECRET_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SECRET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare release signing
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/maximus-release.jks"
          # Only the persistent release keystore may sign production APKs.
          # Missing or invalid secrets must never trigger a new key.
          if [[ -z "${KEYSTORE_B64:-}" || -z "${SECRET_STORE_PASSWORD:-}" || -z "${SECRET_KEY_ALIAS:-}" || -z "${SECRET_KEY_PASSWORD:-}" ]]; then
            echo "::error::Permanent signing secrets are missing. Set all four ANDROID_* repository secrets."
            exit 1
          fi
          umask 077
          if ! printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is invalid."
            exit 1
          fi
          test -s "$KEYSTORE_PATH" || { echo "::error::Decoded keystore is empty."; exit 1; }
          STORE_PASSWORD="$SECRET_STORE_PASSWORD"
          KEY_ALIAS="$SECRET_KEY_ALIAS"
          KEY_PASSWORD="$SECRET_KEY_PASSWORD"
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore password or alias is invalid."
            exit 1
          fi
          SIGNING_MODE="repository-secret"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_MODE=$SIGNING_MODE" >> "$GITHUB_ENV"
          echo "mode=$SIGNING_MODE" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: gradle test --no-daemon --stacktrace

      - name: Run Android lint
        run: gradle lintRelease --no-daemon --stacktrace

      - name: Build signed release APKs
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify and stage ARM64 and universal APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          arm64=(app/build/outputs/apk/release/*arm64-v8a*release*.apk)
          universal=(app/build/outputs/apk/release/*universal*release*.apk)
          if [[ "${#arm64[@]}" -ne 1 || "${#universal[@]}" -ne 1 ]]; then
            echo "Expected exactly one arm64-v8a and one universal APK."
            find app/build/outputs/apk/ -type f -name '*.apk' -print || true
            exit 1
          fi
          cp "${arm64[0]}" "dist/$ARM64_APK"
          cp "${universal[0]}" "dist/$UNIVERSAL_APK"
          for apk in "dist/$ARM64_APK" "dist/$UNIVERSAL_APK"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "dist/$(basename "$apk").badging.txt"
            grep -q "package: name='ai.drfx.maximus.matrixai' versionCode='10003'" "dist/$(basename "$apk").badging.txt"
            grep -q "versionName='1.0.0'" "dist/$(basename "$apk").badging.txt"
          done
          arm_cert=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "dist/$ARM64_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          universal_cert=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "dist/$UNIVERSAL_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test -n "$arm_cert" && test "$arm_cert" = "$universal_cert"
          (cd dist && sha256sum "$ARM64_APK" "$UNIVERSAL_APK" > SHA256SUMS)

      - name: Verify upgrade signing identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --pattern "$ARM64_APK" --dir "$RUNNER_TEMP/prior-release"
          old_cert=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/prior-release/$ARM64_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          new_cert=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "dist/$ARM64_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test -n "$old_cert" && test "$old_cert" = "$new_cert" || { echo '::error::Release certificate differs from the published APK'; exit 1; }
          old_badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$RUNNER_TEMP/prior-release/$ARM64_APK")
          old_code=$(printf '%s\n' "$old_badging" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          test -n "$old_code" && test 10003 -gt "$old_code" || { echo '::error::versionCode must exceed the published APK'; exit 1; }

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Maximus-Matrix-OS-V1.0.0-${{ steps.signing.outputs.mode }}
          path: dist/
          if-no-files-found: error

      - name: Update existing V1.0.0 release
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<NOTES
          # MAXIMUS MATRIX OS V1.0.0

          - Android APK for arm64-v8a
          - Android universal APK
          - Application ID: ai.drfx.maximus.matrixai
          - Version name: 1.0.0; version code: 10003 (monotonic for upgrades)
          - Source: refreshed from supplied Maximus Matrix OS project
          - SHA-256 checksums provided
          - Signing mode: $SIGNING_MODE
          NOTES
          # Keep the existing release and tag throughout publication.
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease)')" = false
          gh release upload "$RELEASE_TAG" \
            "dist/$ARM64_APK" "dist/$UNIVERSAL_APK" "dist/SHA256SUMS" --clobber
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest
